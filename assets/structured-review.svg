<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1248" viewBox="704 354 840 1248" role="img" aria-labelledby="title desc">
<title id="title">Structured rollout review: document preview</title>
<desc id="desc">Illustrative structured review with navigation, a launch gate, an ownership table, a workflow diagram, and next steps. The complete Markdown document is linked from the README.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#17191E"/></marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DCD5C7"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1600" height="1672" rx="24" fill="#FAF6EE" stroke="none" stroke-width="1"/>
<g transform="translate(56 40) scale(1)"><rect x="0" y="0" width="44" height="44" rx="11" fill="#FFCF1A" stroke="#17191E" stroke-width="2"/><text x="5" y="30" font-size="24" font-weight="800" fill="#17191E" text-anchor="start">md</text><text x="60" y="30" font-size="25" font-weight="800" fill="#17191E" text-anchor="start">Rich Markdown First</text></g><text x="1250" y="70" font-size="16" font-weight="700" fill="#615D54" text-anchor="start">ONE BRIEF. TWO PRESENTATIONS.</text><rect x="48" y="108" width="356" height="77" rx="12" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="56" y="165" font-size="72" font-weight="800" fill="#17191E" text-anchor="start">Readable</text><text x="426" y="165" font-size="72" font-weight="800" fill="#17191E" text-anchor="start">by default.</text><text x="59" y="220" font-size="27" font-weight="400" fill="#615D54" text-anchor="start">The agent chooses the structure before it answers.</text><rect x="56" y="258" width="1488" height="64" rx="14" fill="#FFFFFF" stroke="#DDD4C3" stroke-width="1"/><text x="78" y="298" font-size="17" font-weight="700" fill="#615D54" text-anchor="start">YOUR QUESTION</text><text x="265" y="298" font-size="24" font-weight="600" fill="#17191E" text-anchor="start">Prepare an onboarding rollout review for our operations team.</text><rect x="56" y="354" width="620" height="1248" rx="22" fill="#17191E" stroke="none" stroke-width="1"/><text x="86" y="395" font-size="19" font-weight="700" fill="#FFCF1A" text-anchor="start">WITHOUT THE SKILL</text><text x="608" y="395" font-size="16" font-weight="700" fill="#C6C0B5" text-anchor="end">CHAT</text><line x1="86" y1="417" x2="646" y2="417" stroke="#444342"/><text x="86" y="456" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">We should launch the new customer onboarding flow as a small pilot on 2</text><text x="86" y="477" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">November 2026 with 20 invited accounts. The pilot should use the current</text><text x="86" y="498" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">billing integration. Existing accounts should not be migrated, and we</text><text x="86" y="519" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">should not introduce a new payment method during this pilot. The purpose</text><text x="86" y="540" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">of this review is to make the launch decision and the operational</text><text x="86" y="561" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">handoffs clear to the operations team before invitations go out. A</text><text x="86" y="582" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">broader rollout should be considered separately after the pilot review</text><text x="86" y="603" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">rather than treated as part of this decision.</text><text x="86" y="636" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">When a request arrives, the team should validate it. If validation</text><text x="86" y="657" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">fails, the result should be an error with a reason. If validation</text><text x="86" y="678" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">passes, the next step is to attempt payment. If payment is not</text><text x="86" y="699" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">confirmed, the result should also be an error with a reason. The service</text><text x="86" y="720" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">should be provisioned only after payment is confirmed, and the customer</text><text x="86" y="741" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">should then receive a receipt. The request ID should be used to prevent</text><text x="86" y="762" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">duplicate processing if the same request is submitted again.</text><text x="86" y="795" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">Operations should own request validation and triage. Billing should</text><text x="86" y="816" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">reconcile payment status, while Platform should own provisioning and</text><text x="86" y="837" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">rollback. Support should handle receipt resend and customer</text><text x="86" y="858" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">communication. A failed receipt delivery should leave the account</text><text x="86" y="879" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">active. Support should resend the receipt without charging or</text><text x="86" y="900" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">provisioning again. This exception matters because a communication</text><text x="86" y="921" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">failure must not cause the team to repeat a completed payment or create</text><text x="86" y="942" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">another account.</text><text x="86" y="975" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">The readiness check should happen on 28 October, followed by a joint</text><text x="86" y="996" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">Operations and Billing sign-off on 30 October. Both teams must approve</text><text x="86" y="1017" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">before invitations are sent. The pilot should start on 2 November, and</text><text x="86" y="1038" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">the review should take place on 5 November. The decision about expanding</text><text x="86" y="1059" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">beyond the pilot should be made after that review.</text><text x="86" y="1080" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">Payment-reconciliation coverage outside normal support hours is still an</text><text x="86" y="1101" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">open question and should be resolved before the pilot needs that</text><text x="86" y="1122" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">coverage.</text><text x="86" y="1155" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">If a payment/provisioning mismatch appears, new invitations should stop.</text><text x="86" y="1176" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">The team should reconcile the mismatch before resuming them. Stopping</text><text x="86" y="1197" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">invitations should not automatically refund payments or delete existing</text><text x="86" y="1218" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">accounts. The team should report the number of requests, confirmed</text><text x="86" y="1239" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">payments, provisioned accounts, and receipts each day at 13:00 UTC.</text><text x="86" y="1260" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">These counts describe activity; they should not be presented as cohort</text><text x="86" y="1281" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">conversion unless the relevant records are linked to one another.</text><text x="86" y="1314" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">Before the readiness check, Operations should verify invalid-request</text><text x="86" y="1335" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">cases and Billing should test unconfirmed payments, both by 28 October.</text><text x="86" y="1356" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">Platform should rehearse rollback by 30 October, and Support should</text><text x="86" y="1377" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">prepare receipt recovery by the same date. These tasks, the two-team</text><text x="86" y="1398" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">approval gate, and the unresolved coverage question should remain</text><text x="86" y="1419" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">visible in the launch review so that a reader can identify the next</text><text x="86" y="1440" font-size="16.5" font-weight="400" fill="#DCD7CB" text-anchor="start">action without reconstructing the plan from the process description.</text><rect x="704" y="354" width="840" height="1248" rx="22" fill="#FFFFFF" stroke="#DDD4C3" stroke-width="1"/><rect x="732" y="378" width="206" height="32" rx="16" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="749" y="401" font-size="18" font-weight="700" fill="#17191E" text-anchor="start">WITH THE SKILL</text><text x="1512" y="401" font-size="17" font-weight="400" fill="#615D54" text-anchor="end">onboarding-review.md</text><text x="738" y="462" font-size="35" font-weight="800" fill="#17191E" text-anchor="start">Onboarding rollout review</text><text x="738" y="501" font-size="18" font-weight="400" fill="#615D54" text-anchor="start">Pilot: 20 invited accounts · Launch: 2 Nov · Review: 5 Nov</text><text x="738" y="535" font-size="17" font-weight="400" fill="#615D54" text-anchor="start">Decision  /  Owners  /  Workflow  /  Rollout  /  Next steps</text><rect x="738" y="558" width="772" height="90" rx="10" fill="#FFF4B5" stroke="none" stroke-width="1"/><rect x="738" y="558" width="6" height="90" rx="0" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="759" y="587" font-size="15" font-weight="700" fill="#17191E" text-anchor="start">LAUNCH GATE</text><text x="759" y="620" font-size="23" font-weight="700" fill="#17191E" text-anchor="start">Operations AND Billing must both approve.</text><text x="738" y="696" font-size="27" font-weight="700" fill="#17191E" text-anchor="start">Owners &amp; handoffs</text><rect x="738" y="720" width="772" height="36" rx="7" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="750" y="744.84" font-size="18" font-weight="700" fill="#17191E" text-anchor="start">Team</text><text x="916" y="744.84" font-size="18" font-weight="700" fill="#17191E" text-anchor="start">Responsibility</text><text x="750" y="780.84" font-size="18" font-weight="600" fill="#17191E" text-anchor="start">Operations</text><text x="916" y="780.84" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Request validation and triage</text><line x1="738" y1="792" x2="1510" y2="792" stroke="#E4DDD0"/><rect x="738" y="792" width="772" height="36" rx="0" fill="#FAF6EE" stroke="none" stroke-width="1"/><text x="750" y="816.84" font-size="18" font-weight="600" fill="#17191E" text-anchor="start">Billing</text><text x="916" y="816.84" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Payment-status reconciliation</text><line x1="738" y1="828" x2="1510" y2="828" stroke="#E4DDD0"/><text x="750" y="852.84" font-size="18" font-weight="600" fill="#17191E" text-anchor="start">Platform</text><text x="916" y="852.84" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Provisioning and rollback</text><line x1="738" y1="864" x2="1510" y2="864" stroke="#E4DDD0"/><rect x="738" y="864" width="772" height="36" rx="0" fill="#FAF6EE" stroke="none" stroke-width="1"/><text x="750" y="888.84" font-size="18" font-weight="600" fill="#17191E" text-anchor="start">Support</text><text x="916" y="888.84" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Receipt resend and customer communication</text><line x1="738" y1="900" x2="1510" y2="900" stroke="#E4DDD0"/><text x="738" y="947" font-size="27" font-weight="700" fill="#17191E" text-anchor="start">Activation workflow</text><rect x="738" y="968" width="772" height="318" rx="8" fill="url(#dots)" stroke="none" stroke-width="1"/><g transform="translate(748 972) scale(.80) translate(-596 -360)"><g class="workflow-edge" data-start="A" data-end="B" data-label=""><path class="edge" d="M732 418H796" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M732 418H796" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="B" data-end="C" data-label="Yes"><path class="edge" d="M932 418H1012" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M932 418H1012" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="954" y="398" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">Yes</text></g><g class="workflow-edge" data-start="C" data-end="D" data-label=""><path class="edge" d="M1164 418H1256" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M1164 418H1256" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="D" data-end="E" data-label="Yes"><path class="edge" d="M1344 476V576" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M1344 476V576" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1362" y="533" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">Yes</text></g><g class="workflow-edge" data-start="E" data-end="F" data-label=""><path class="edge" d="M1252 616H1184" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M1252 616H1184" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="B" data-end="G" data-label="No"><path class="edge" d="M864 472V582Q864 602 844 602H838V629" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="882" y="548" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">No</text></g><g class="workflow-edge" data-start="D" data-end="G" data-label="No"><path class="edge" d="M1432 418H1454Q1472 418 1472 436V742Q1472 760 1454 760H856Q838 760 838 742V701" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1483" y="468" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">No</text></g><g class="workflow-node" data-id="A" data-label="Incoming request"><rect x="596" y="383" width="136" height="70" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="664" y="412.96" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Incoming</text><text x="664" y="437.32" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">request</text></g><g class="workflow-node" data-id="B" data-label="Request valid?"><polygon points="864,364 932,418 864,472 796,418" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="864" y="412.96" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Request</text><text x="864" y="437.32" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">valid?</text></g><g class="workflow-node" data-id="C" data-label="Attempt payment"><rect x="1012" y="379" width="152" height="78" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="1088" y="412.72" font-size="22" font-weight="500" fill="#17191E" text-anchor="middle">Attempt</text><text x="1088" y="438.24" font-size="22" font-weight="500" fill="#17191E" text-anchor="middle">payment</text></g><g class="workflow-node" data-id="D" data-label="Payment confirmed?"><polygon points="1344,360 1432,418 1344,476 1256,418" fill="#FFCF1A" stroke="#17191E" stroke-width="2.4"/><text x="1344" y="412.96" font-size="21" font-weight="700" fill="#17191E" text-anchor="middle">Payment</text><text x="1344" y="437.32" font-size="21" font-weight="700" fill="#17191E" text-anchor="middle">confirmed?</text></g><g class="workflow-node" data-id="E" data-label="Provision service"><rect x="1252" y="576" width="184" height="80" rx="14" fill="#17191E" stroke="#17191E" stroke-width="2.4"/><text x="1344" y="610.48" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Provision</text><text x="1344" y="637.16" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">service</text></g><g class="workflow-node" data-id="F" data-label="Send receipt"><rect x="1024" y="576" width="160" height="80" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="1104" y="623.48" font-size="22" font-weight="500" fill="#17191E" text-anchor="middle">Send receipt</text></g><g class="workflow-node" data-id="G" data-label="Error + reason"><rect x="731" y="629" width="214" height="72" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="838" y="672.48" font-size="22" font-weight="500" fill="#17191E" text-anchor="middle">Error + reason</text></g></g><rect x="738" y="1307" width="772" height="74" rx="10" fill="#FAF6EE" stroke="none" stroke-width="1"/><rect x="738" y="1307" width="5" height="74" rx="0" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="757" y="1337" font-size="18" font-weight="600" fill="#17191E" text-anchor="start">Receipt failure: keep the account active; Support resends it.</text><text x="757" y="1362" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Do not charge or provision again.</text><text x="738" y="1426" font-size="27" font-weight="700" fill="#17191E" text-anchor="start">Next steps</text><rect x="738" y="1452" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="766" y="1467" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Operations: verify invalid-request cases — 28 October</text><rect x="738" y="1485" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="766" y="1500" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Billing: test unconfirmed payments — 28 October</text><rect x="738" y="1518" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="766" y="1533" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Platform: rehearse rollback — 30 October</text><rect x="738" y="1551" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="766" y="1566" font-size="18" font-weight="400" fill="#17191E" text-anchor="start">Support: prepare receipt recovery — 30 October</text><text x="56" y="1641" font-size="18" font-weight="400" fill="#615D54" text-anchor="start">Document previews · Same brief and facts · Complete plain reply and structured document linked below</text>
</svg>
