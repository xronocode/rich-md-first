<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2200" viewBox="0 0 720 2200" role="img" aria-labelledby="title desc">
<title id="title">Readable by default: one long reply, a structured document</title>
<desc id="desc">One shared brief produces a long plain chat reply or a structured onboarding rollout review with navigation, a launch gate, team ownership, a workflow, and next steps. Complete source and result files are included.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#17191E"/></marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DCD5C7"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="720" height="2200" rx="24" fill="#FAF6EE" stroke="none" stroke-width="1"/>
<g transform="translate(36 32) scale(1.05)"><rect x="0" y="0" width="44" height="44" rx="11" fill="#FFCF1A" stroke="#17191E" stroke-width="2"/><text x="5" y="30" font-size="24" font-weight="800" fill="#17191E" text-anchor="start">md</text><text x="60" y="30" font-size="25" font-weight="800" fill="#17191E" text-anchor="start">Rich Markdown First</text></g><text x="36" y="149" font-size="51" font-weight="800" fill="#17191E" text-anchor="start">Readable answers.</text><rect x="27" y="166" width="327" height="63" rx="10" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="36" y="213" font-size="51" font-weight="800" fill="#17191E" text-anchor="start">By default.</text><rect x="28" y="262" width="664" height="100" rx="14" fill="#FFFFFF" stroke="#DDD4C3" stroke-width="1"/><text x="48" y="295" font-size="19" font-weight="700" fill="#615D54" text-anchor="start">ONE SHARED BRIEF</text><text x="48" y="331" font-size="27" font-weight="600" fill="#17191E" text-anchor="start">Prepare an onboarding rollout review.</text><rect x="28" y="396" width="664" height="470" rx="18" fill="#17191E" stroke="none" stroke-width="1"/><text x="52" y="437" font-size="23" font-weight="700" fill="#FFCF1A" text-anchor="start">WITHOUT THE SKILL</text><text x="52" y="469" font-size="21" font-weight="400" fill="#C6C0B5" text-anchor="start">Long chat reply · excerpt</text><text x="52" y="510" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">We should launch the new customer onboarding flow as a</text><text x="52" y="537" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">small pilot on 2 November 2026 with 20 invited accounts.</text><text x="52" y="564" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">The pilot should use the current billing integration.</text><text x="52" y="591" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">Existing accounts should not be migrated, and we should</text><text x="52" y="618" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">not introduce a new payment method during this pilot.</text><text x="52" y="645" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">The purpose of this review is to make the launch</text><text x="52" y="672" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">decision and the operational handoffs clear to the</text><text x="52" y="699" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">operations team before invitations go out. A broader</text><text x="52" y="726" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">rollout should be considered separately after the pilot</text><text x="52" y="753" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">review rather than treated as part of this decision.</text><text x="52" y="780" font-size="21" font-weight="400" fill="#DCD7CB" text-anchor="start">When a request arrives, the team should validate it. If</text><text x="52" y="836" font-size="21" font-weight="400" fill="#C6C0B5" text-anchor="start">… full reply linked below</text><rect x="28" y="902" width="664" height="1230" rx="18" fill="#FFFFFF" stroke="#DDD4C3" stroke-width="1"/><rect x="52" y="928" width="252" height="34" rx="17" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="68" y="952" font-size="22" font-weight="700" fill="#17191E" text-anchor="start">WITH THE SKILL</text><text x="52" y="1011" font-size="31" font-weight="800" fill="#17191E" text-anchor="start">Onboarding rollout review</text><text x="52" y="1048" font-size="23" font-weight="400" fill="#615D54" text-anchor="start">20 invited accounts · 2 November</text><text x="52" y="1085" font-size="21" font-weight="400" fill="#615D54" text-anchor="start">Decision · Owners · Workflow · Actions</text><rect x="52" y="1110" width="616" height="101" rx="9" fill="#FFF4B5" stroke="none" stroke-width="1"/><rect x="52" y="1110" width="6" height="101" rx="0" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="70" y="1140" font-size="18" font-weight="700" fill="#17191E" text-anchor="start">LAUNCH GATE</text><text x="70" y="1173" font-size="24" font-weight="700" fill="#17191E" text-anchor="start">Operations AND Billing must</text><text x="70" y="1200" font-size="24" font-weight="700" fill="#17191E" text-anchor="start">approve before invitations.</text><text x="52" y="1260" font-size="26" font-weight="700" fill="#17191E" text-anchor="start">Owners &amp; handoffs</text><rect x="52" y="1283" width="616" height="36" rx="7" fill="#FFCF1A" stroke="none" stroke-width="1"/><text x="64" y="1307.84" font-size="23" font-weight="700" fill="#17191E" text-anchor="start">Team</text><text x="204" y="1307.84" font-size="23" font-weight="700" fill="#17191E" text-anchor="start">Responsibility</text><text x="64" y="1343.84" font-size="23" font-weight="600" fill="#17191E" text-anchor="start">Operations</text><text x="204" y="1343.84" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Validation + triage</text><line x1="52" y1="1355" x2="668" y2="1355" stroke="#E4DDD0"/><rect x="52" y="1355" width="616" height="36" rx="0" fill="#FAF6EE" stroke="none" stroke-width="1"/><text x="64" y="1379.84" font-size="23" font-weight="600" fill="#17191E" text-anchor="start">Billing</text><text x="204" y="1379.84" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Payment reconciliation</text><line x1="52" y1="1391" x2="668" y2="1391" stroke="#E4DDD0"/><text x="64" y="1415.84" font-size="23" font-weight="600" fill="#17191E" text-anchor="start">Platform</text><text x="204" y="1415.84" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Provisioning and rollback</text><line x1="52" y1="1427" x2="668" y2="1427" stroke="#E4DDD0"/><rect x="52" y="1427" width="616" height="36" rx="0" fill="#FAF6EE" stroke="none" stroke-width="1"/><text x="64" y="1451.84" font-size="23" font-weight="600" fill="#17191E" text-anchor="start">Support</text><text x="204" y="1451.84" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Receipts + communication</text><line x1="52" y1="1463" x2="668" y2="1463" stroke="#E4DDD0"/><text x="52" y="1518" font-size="26" font-weight="700" fill="#17191E" text-anchor="start">Activation workflow</text><g transform="translate(67 1558)"><g class="workflow-edge" data-start="A" data-end="B" data-label=""><path class="edge" d="M141 48H212" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M141 48H212" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="B" data-end="C" data-label="Yes"><path class="edge" d="M352 48H426" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M352 48H426" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="366" y="27" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">Yes</text></g><g class="workflow-edge" data-start="C" data-end="D" data-label=""><path class="edge" d="M500 81V140" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M500 81V140" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="D" data-end="E" data-label="Yes"><path class="edge" d="M500 250V323H361" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M500 250V323H361" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="516" y="292" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">Yes</text></g><g class="workflow-edge" data-start="E" data-end="F" data-label=""><path class="edge" d="M203 323H141" fill="none" stroke="#FFCF1A" stroke-width="12"/><path class="edge" d="M203 323H141" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/></g><g class="workflow-edge" data-start="B" data-end="G" data-label="No"><path class="edge" d="M282 96V118Q282 130 270 130H112Q100 130 100 142V160" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="299" y="126" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">No</text></g><g class="workflow-edge" data-start="D" data-end="G" data-label="No"><path class="edge" d="M415 195H188" fill="none" stroke="#17191E" stroke-width="2.8" marker-end="url(#arrow)"/><text x="290" y="176" font-size="21" font-weight="700" fill="#17191E" text-anchor="start">No</text></g><g class="workflow-node" data-id="A" data-label="Incoming request"><rect x="11" y="15" width="130" height="66" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="76" y="42.96" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Incoming</text><text x="76" y="67.32" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">request</text></g><g class="workflow-node" data-id="B" data-label="Request valid?"><polygon points="282,0 352,48 282,96 212,48" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="282" y="42.96" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Request</text><text x="282" y="67.32" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">valid?</text></g><g class="workflow-node" data-id="C" data-label="Attempt payment"><rect x="426" y="15" width="148" height="66" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="500" y="42.96" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Attempt</text><text x="500" y="67.32" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">payment</text></g><g class="workflow-node" data-id="D" data-label="Payment confirmed?"><polygon points="500,140 585,195 500,250 415,195" fill="#FFCF1A" stroke="#17191E" stroke-width="2.4"/><text x="500" y="189.95999999999998" font-size="21" font-weight="700" fill="#17191E" text-anchor="middle">Payment</text><text x="500" y="214.32" font-size="21" font-weight="700" fill="#17191E" text-anchor="middle">confirmed?</text></g><g class="workflow-node" data-id="E" data-label="Provision service"><rect x="203" y="287" width="158" height="72" rx="14" fill="#17191E" stroke="#17191E" stroke-width="2.4"/><text x="282" y="317.96" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Provision</text><text x="282" y="342.32" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">service</text></g><g class="workflow-node" data-id="F" data-label="Send receipt"><rect x="11" y="290" width="130" height="66" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="76" y="330.14" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Send receipt</text></g><g class="workflow-node" data-id="G" data-label="Error + reason"><rect x="12" y="160" width="176" height="70" rx="14" fill="#FFFFFF" stroke="#17191E" stroke-width="2.4"/><text x="100" y="202.14" font-size="21" font-weight="500" fill="#17191E" text-anchor="middle">Error + reason</text></g></g><text x="52" y="1970" font-size="26" font-weight="700" fill="#17191E" text-anchor="start">Next steps</text><rect x="52" y="1995" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="80" y="2010" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Ops: Check invalid requests — 28 Oct</text><rect x="52" y="2031" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="80" y="2046" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Billing: Test unconfirmed payments — 28 Oct</text><rect x="52" y="2067" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="80" y="2082" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Platform: Rehearse rollback — 30 Oct</text><rect x="52" y="2103" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#17191E" stroke-width="1.8"/><text x="80" y="2118" font-size="23" font-weight="400" fill="#17191E" text-anchor="start">Support: Prepare receipt recovery — 30 Oct</text><text x="28" y="2170" font-size="21" font-weight="400" fill="#615D54" text-anchor="start">Document previews · Complete versions linked below</text>
</svg>
